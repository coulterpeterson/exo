name: Release

# Publishing a GitHub Release builds all three desktop targets and attaches
# them to it. Use workflow_dispatch to rebuild assets for a tag that already
# has a release.
#
# This replaces the upstream mac-only pipeline, which signed and notarized on
# every run and so could not complete without an Apple Developer account.
# Signing here is opt-in: set the CSC_* secrets and macOS builds are signed,
# leave them unset and the build still produces an unsigned .dmg.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Cheap gate on one runner rather than three — a broken build should fail
  # before three packagers spend ten minutes each proving it.
  verify:
    name: Type check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  build:
    name: Build ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not deny the other two their artifacts.
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS, flag: "--mac" }
          - { os: windows-latest, label: Windows, flag: "--win" }
          - { os: ubuntu-latest, label: Linux, flag: "--linux" }
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build
        shell: bash
        env:
          # Absent on a fork without its own Google credentials. The app falls
          # back to a credentials.json the user supplies (see the setup wizard),
          # so builds are still usable — they just don't ship a client id.
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: npm run build

      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # electron-builder signs automatically when CSC_LINK is set. With no
          # certificate it otherwise goes looking for an identity in the
          # keychain and fails the build rather than producing an unsigned app.
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No signing certificate configured — building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.flag }} --publish never
        timeout-minutes: 20

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          # Only the distributables. release/ also holds unpacked app
          # directories and builder-debug.yml, which nobody wants attached.
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done < <(
            find release -maxdepth 1 -type f \
              \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
                 -o -name '*.AppImage' -o -name '*.deb' \
                 -o -name '*.blockmap' -o -name 'latest*.yml' \) | sort
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No distributables were produced for ${{ matrix.label }}"
            exit 1
          fi
          printf 'Attaching: %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
